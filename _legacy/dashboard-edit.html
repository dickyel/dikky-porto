<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Project — Dikky Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body class="admin-body" id="adminBody">
  <aside class="admin-sidebar">
    <a href="index.html" class="logo" aria-label="Home">
      <span class="logo-mark">D</span>
    </a>
    <p class="admin-brand">Dikky Admin</p>
    <nav>
      <a href="dashboard.html">Projects</a>
      <a class="is-active" href="dashboard-edit.html">Tambah Project</a>
      <a href="index.html" target="_blank" rel="noopener">Lihat Website</a>
    </nav>
    <div class="admin-user">
      <strong id="adminName">Admin</strong>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-top">
      <div>
        <button class="btn btn-outline admin-mobile-toggle" id="sidebarToggle" type="button">Menu</button>
        <p class="eyebrow">Dashboard</p>
        <h1 id="formHeading">Tambah Project</h1>
      </div>
      <a class="btn btn-outline" href="dashboard.html">← Kembali</a>
    </div>

    <div class="form-card">
      <form id="projectForm" class="form-grid">
        <input type="hidden" id="projectId" />

        <label class="full">
          <span>Judul</span>
          <input type="text" id="title" required placeholder="Nama project" />
        </label>

        <label>
          <span>Slug</span>
          <input type="text" id="slug" required placeholder="nama-project" />
        </label>

        <label>
          <span>Category</span>
          <input type="text" id="category" required placeholder="Mobile App · Product Design" />
        </label>

        <label>
          <span>Client</span>
          <input type="text" id="client" required placeholder="Nama client" />
        </label>

        <label>
          <span>Year</span>
          <input type="text" id="year" required placeholder="2025" />
        </label>

        <label class="full">
          <span>Cover image URL</span>
          <input type="url" id="cover" required placeholder="https://..." />
        </label>

        <label class="full">
          <span>Summary</span>
          <textarea id="summary" required placeholder="Ringkasan singkat project"></textarea>
        </label>

        <label class="full">
          <span>Description</span>
          <textarea id="description" required placeholder="Cerita case study lengkap"></textarea>
        </label>

        <label class="full">
          <span>Tags (pisahkan dengan koma)</span>
          <input type="text" id="tags" placeholder="UI/UX, Mobile, Product Design" />
        </label>

        <label class="full">
          <span>Gallery URLs (satu URL per baris)</span>
          <textarea id="gallery" placeholder="https://image-1.jpg&#10;https://image-2.jpg"></textarea>
        </label>

        <label class="form-check full">
          <input type="checkbox" id="featured" />
          <span>Tandai sebagai featured project</span>
        </label>

        <div class="form-actions full">
          <button type="submit" class="btn btn-accent">Simpan project</button>
          <a class="btn btn-outline" href="dashboard.html">Batal</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/projects-data.js"></script>
  <script>
    (() => {
      if (!DikkyStore.requireAuth()) return;

      document.getElementById("adminName").textContent = DikkyStore.currentUser();
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        DikkyStore.logout();
        window.location.href = "login.html";
      });
      document.getElementById("sidebarToggle").addEventListener("click", () => {
        document.getElementById("adminBody").classList.toggle("sidebar-open");
      });

      const params = new URLSearchParams(window.location.search);
      const editId = params.get("id");
      const existing = editId ? DikkyStore.getById(editId) : null;
      const titleInput = document.getElementById("title");
      const slugInput = document.getElementById("slug");
      let slugTouched = false;

      if (existing) {
        document.getElementById("formHeading").textContent = "Edit Project";
        document.title = "Edit Project — Dikky Admin";
        document.getElementById("projectId").value = existing.id;
        titleInput.value = existing.title || "";
        slugInput.value = existing.slug || "";
        document.getElementById("category").value = existing.category || "";
        document.getElementById("client").value = existing.client || "";
        document.getElementById("year").value = existing.year || "";
        document.getElementById("cover").value = existing.cover || "";
        document.getElementById("summary").value = existing.summary || "";
        document.getElementById("description").value = existing.description || "";
        document.getElementById("tags").value = (existing.tags || []).join(", ");
        document.getElementById("gallery").value = (existing.gallery || []).join("\n");
        document.getElementById("featured").checked = !!existing.featured;
        slugTouched = true;
      }

      titleInput.addEventListener("input", () => {
        if (!slugTouched) slugInput.value = DikkyStore.slugify(titleInput.value);
      });
      slugInput.addEventListener("input", () => {
        slugTouched = true;
      });

      document.getElementById("projectForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const gallery = document
          .getElementById("gallery")
          .value.split("\n")
          .map((s) => s.trim())
          .filter(Boolean);

        const tags = document
          .getElementById("tags")
          .value.split(",")
          .map((s) => s.trim())
          .filter(Boolean);

        const project = {
          id: document.getElementById("projectId").value || DikkyStore.uid(),
          slug: DikkyStore.slugify(slugInput.value),
          title: titleInput.value.trim(),
          category: document.getElementById("category").value.trim(),
          client: document.getElementById("client").value.trim(),
          year: document.getElementById("year").value.trim(),
          cover: document.getElementById("cover").value.trim(),
          summary: document.getElementById("summary").value.trim(),
          description: document.getElementById("description").value.trim(),
          tags,
          gallery: gallery.length ? gallery : [document.getElementById("cover").value.trim()],
          featured: document.getElementById("featured").checked,
        };

        DikkyStore.upsert(project);
        window.location.href = "dashboard.html";
      });
    })();
  </script>
</body>
</html>
