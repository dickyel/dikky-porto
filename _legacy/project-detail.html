<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Detail — Dikky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body class="detail-page">
  <header class="page-header">
    <div class="page-header-left">
      <a href="index.html" class="logo" aria-label="Dikky home">
        <span class="logo-mark">D</span>
      </a>
      <a class="page-back" href="index.html#portfolio">← Portfolio</a>
    </div>
    <nav class="page-header-nav" aria-label="Primary">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link is-active" href="index.html#portfolio">Work</a>
      <a class="nav-link" href="index.html#contact">Contact</a>
    </nav>
    <a href="login.html" class="btn btn-outline page-header-cta">Admin</a>
  </header>

  <section class="detail-hero" id="detailHero">
    <img id="detailCover" src="" alt="" />
    <div class="detail-hero-overlay"></div>
    <div class="detail-hero-content">
      <p class="eyebrow" id="detailCategory">Project</p>
      <h1 id="detailTitle">Loading…</h1>
      <div class="detail-meta">
        <span id="detailClient"></span>
        <span id="detailYear"></span>
      </div>
    </div>
  </section>

  <section class="detail-body">
    <div class="detail-copy">
      <h2>Overview</h2>
      <p id="detailSummary"></p>
      <h2>Case study</h2>
      <p id="detailDescription"></p>
    </div>
    <aside class="detail-side">
      <dl>
        <div>
          <dt>Client</dt>
          <dd id="sideClient">—</dd>
        </div>
        <div>
          <dt>Year</dt>
          <dd id="sideYear">—</dd>
        </div>
        <div>
          <dt>Category</dt>
          <dd id="sideCategory">—</dd>
        </div>
        <div>
          <dt>Tags</dt>
          <dd>
            <div class="tag-row" id="sideTags"></div>
          </dd>
        </div>
      </dl>
      <a href="index.html#contact" class="btn btn-accent detail-side-cta">Start a project</a>
    </aside>
  </section>

  <section class="detail-gallery" id="detailGallery" aria-label="Project gallery"></section>

  <section class="detail-next" id="detailNext" hidden>
    <div>
      <p>Next project</p>
      <strong id="nextTitle"></strong>
    </div>
    <a id="nextLink" class="btn btn-accent" href="#">View case</a>
  </section>

  <footer class="site-footer detail-footer">
    <p>© <span id="year"></span> Dikky. All rights reserved.</p>
    <a class="text-link" href="index.html#portfolio">← Back to portfolio</a>
  </footer>

  <script src="js/projects-data.js"></script>
  <script>
    (() => {
      document.getElementById("year").textContent = String(new Date().getFullYear());

      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug") || "voltgear-ev-tracking";
      const projects = DikkyStore.getProjects();
      const project = DikkyStore.getBySlug(slug) || projects[0];

      if (!project) {
        document.getElementById("detailTitle").textContent = "Project not found";
        return;
      }

      document.title = `${project.title} — Dikky`;
      document.getElementById("detailCover").src = project.cover;
      document.getElementById("detailCover").alt = project.title;
      document.getElementById("detailCategory").textContent = project.category;
      document.getElementById("detailTitle").textContent = project.title;
      document.getElementById("detailClient").textContent = `Client: ${project.client}`;
      document.getElementById("detailYear").textContent = `Year: ${project.year}`;
      document.getElementById("detailSummary").textContent = project.summary;
      document.getElementById("detailDescription").textContent = project.description;
      document.getElementById("sideClient").textContent = project.client;
      document.getElementById("sideYear").textContent = project.year;
      document.getElementById("sideCategory").textContent = project.category;

      const tags = document.getElementById("sideTags");
      tags.innerHTML = (project.tags || [])
        .map((tag) => `<span class="tag">${tag}</span>`)
        .join("");

      const gallery = document.getElementById("detailGallery");
      gallery.innerHTML = (project.gallery || [project.cover])
        .map((src) => `<img src="${src}" alt="${project.title} gallery" />`)
        .join("");

      const idx = projects.findIndex((p) => p.id === project.id);
      const next = projects[(idx + 1) % projects.length];
      if (next && next.id !== project.id) {
        document.getElementById("detailNext").hidden = false;
        document.getElementById("nextTitle").textContent = next.title;
        document.getElementById("nextLink").href = `project-detail.html?slug=${encodeURIComponent(next.slug)}`;
      }
    })();
  </script>
</body>
</html>
